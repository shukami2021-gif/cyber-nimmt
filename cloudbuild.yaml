steps:
  # ① Node.js のビルド環境。バージョンは有効な「24」を指定します。
  - name: 'gcr.io/google-appengine/nodejs'
    args: ['bash', '-c', 'npm install && npm run build']
    env:
      - 'GOOGLE_NODEJS_RUNTIMES_VERSION=26'

  # ② 組み立てたアプリを、正しい名前・正しいリージョン（東京）で Cloud Run へデプロイする
  - name: 'gcr.io/google-cloud-sdk/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cyber-nimmt'
      - '--source=.'
      - '--region=asia-northeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY