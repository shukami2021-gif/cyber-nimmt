steps:
  # ① 工場に「Node.js 20を使うよ！」と伝えてから組み立てる
  - name: 'gcr.io/google-appengine/nodejs'
    args: ['bash', '-c', 'npm install && npm run build']
    env:
      - 'GOOGLE_NODE_RUNTIMES_VERSION=20'

  # ② 組み立てたアプリを Cloud Run へデプロイする
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nimmt-board-game'
      - '--source=.'
      - '--region=asia-east1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY