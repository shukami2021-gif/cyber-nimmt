steps:
  # ① ビルド環境（Node.js 22）。まず依存パッケージをインストールしてから、ビルドを実行します
  - name: 'node:22'
    entrypoint: 'bash'
    args: ['-c', 'npm install && npm run build']

  # ② 組み立てたアプリを、正しい名前・正しいリージョン（東京）で Cloud Run へデプロイする
  - name: 'gcr.io/google-cloud-sdk/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cyber-nimmt'
      - '--source=.'
      - '--region=asia-northeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY