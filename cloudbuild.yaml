steps:
  # ① ソースコードを元に、アプリのパッケージを自動で組み立てる
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - 'gcr.io/$PROJECT_ID/nimmt-board-game'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'

  # ② 組み立てたパッケージを、正しい場所（asia-east1）へ上書きデプロイする
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nimmt-board-game'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nimmt-board-game'
      - '--region'
      - 'asia-east1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY