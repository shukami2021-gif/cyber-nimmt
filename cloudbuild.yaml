steps:
  # ① ビルド環境（Node.js 22）。依存パッケージをインストールしてビルド
  - name: 'node:22'
    entrypoint: 'bash'
    args: ['-c', 'npm install && npm run build']

  # ② 組み立てたアプリを Cloud Run へデプロイする（ツールを最新の場所に変更）
  - name: 'google/cloud-sdk:latest'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cyber-nimmt'
      - '--source=.'
      - '--region=asia-northeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY