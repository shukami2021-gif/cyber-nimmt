steps:
  # ① ビルド環境。最新の構文を正しく解釈できる Node.js 22 の公式環境を使用します
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']

  # ② 組み立てたアプリを、正しい名前・正しいリージョン（東京）で Cloud Run へデプロイする
  - name: 'gcr.io/google-cloud-sdk/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cyber-nimmt'
      - '--source=.'
      - '--region=asia-northeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY